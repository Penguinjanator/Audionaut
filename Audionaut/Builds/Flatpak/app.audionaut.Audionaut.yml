# Flatpak manifest for Audionaut.
#
# Local build + install for testing:
#   flatpak install -y flathub org.gnome.Platform//51 org.gnome.Sdk//51
#   flatpak-builder --force-clean --user --install build-dir \
#       Audionaut/Builds/Flatpak/app.audionaut.Audionaut.yml
#   flatpak run app.audionaut.Audionaut
#
# Flathub builds run OFFLINE: every download happens up front from the
# `sources:` lists below, and the git sources must pin a commit.
#
# Verified end to end: builds, installs and runs in the sandbox. Remaining
# gaps (screenshots, aarch64, Flathub submission) in README.md next to this
# file.

app-id: app.audionaut.Audionaut
# GNOME runtime rather than Freedesktop: the LinuxMakefile compile needs
# webkit2gtk-4.1 and gtk+-x11-3.0 headers (JUCE webview interop — compiled
# against, dlopened at runtime), which only the GNOME runtime ships.
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: audionaut

finish-args:
  # JUCE has no Wayland backend yet; X11 (or XWayland) only.
  - --socket=x11
  - --share=ipc
  # OpenGL / video acceleration.
  - --device=dri
  # Audio. JUCE's ALSA backend reaches the host through PipeWire's ALSA
  # plugin (via the Pulse socket) — no raw device access needed. If direct
  # hw: ALSA devices turn out to be required, that becomes --device=all
  # (needs justification in the Flathub review, cf. Ardour).
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  # GA4 analytics, the Demucs model download, and Ableton Link (LAN UDP
  # multicast) all ride on plain network access.
  - --share=network
  # .audium projects are directory packages and JUCE's file chooser does not
  # speak the XDG document portal, so grant the home directory. TODO: narrow
  # this (e.g. to xdg-music) or move to portals if/when JUCE supports them.
  - --filesystem=home

cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
  - '*.la'

modules:
  - name: audionaut
    buildsystem: simple
    # x86_64 only until an aarch64 build has been tried. What forced it -
    # Essentia's fftw build passing x86 SSE2 flags - is gone.
    only-arches:
      - x86_64
    build-commands:
      # Build the app. Each compile job needs well over 1 GB of RAM; cap the
      # parallelism rather than using FLATPAK_BUILDER_N_JOBS blindly.
      - make -C Audionaut/Builds/LinuxMakefile CONFIG=Release -j8
      # Install, renaming desktop entry / icon / MIME definition to the
      # app id as Flathub requires (and pointing their icon references at it).
      - install -Dm755 Audionaut/Builds/LinuxMakefile/build/audionaut /app/bin/audionaut
      - sed 's/^Icon=audionaut$/Icon=app.audionaut.Audionaut/' Audionaut/Resources/audionaut.desktop > app.audionaut.Audionaut.desktop
      - install -Dm644 app.audionaut.Audionaut.desktop /app/share/applications/app.audionaut.Audionaut.desktop
      - install -Dm644 Audionaut/Resources/audionaut_logo_512x512.png /app/share/icons/hicolor/512x512/apps/app.audionaut.Audionaut.png
      - sed 's/icon name="audionaut"/icon name="app.audionaut.Audionaut"/' Audionaut/Builds/Debian/audionaut.xml > app.audionaut.Audionaut.xml
      - install -Dm644 app.audionaut.Audionaut.xml /app/share/mime/packages/app.audionaut.Audionaut.xml
      # The metainfo ships next to the manifest (file source below), not from
      # the pinned git tag — this is also how the Flathub manifest repo works.
      - install -Dm644 app.audionaut.Audionaut.metainfo.xml /app/share/metainfo/app.audionaut.Audionaut.metainfo.xml
    sources:
      # The app, pinned to a release tag. Automatic submodule fetching is
      # OFF: most submodule content is test-only data the build never reads -
      # Catch2, demucs.cpp's vendor/{demucs,googletest,libnyquist} and
      # farbot's googletest. The submodules the Linux build really needs are pinned
      # individually below (commits = `git ls-tree <tag> Submodules/`); every
      # pinned source disables nested submodules too — none are needed, and
      # the runners' older flatpak-builder (1.2.x) fails to clone nested
      # mirrors whose pinned commit sits behind no branch head.
      # All pins are kept current by sync-pins.py (run automatically by
      # release-linux.yml; run it by hand when bumping the committed pins).
      - type: git
        url: https://github.com/kvoltmer/Audionaut.git
        tag: v1.6.4
        commit: 0943a1fe7f0915866fc725ad011a71ea17583da2
        disable-submodules: true

      - type: git
        url: https://github.com/juce-framework/JUCE.git
        commit: 72782788ce18c2d4d760b28e0921d6ffc6431102
        dest: Submodules/JUCE
        disable-submodules: true
      - type: git
        url: https://github.com/hogliux/farbot.git
        commit: d8f132c2e2ac44b379632e452700abe71ca3a92e
        dest: Submodules/farbot
        disable-submodules: true
      - type: git
        url: https://github.com/nlohmann/json.git
        commit: f682cd2ef1677e1218d714abb177fa2a93eadccf
        dest: Submodules/json
        disable-submodules: true
      - type: git
        url: https://github.com/Ableton/link.git
        commit: 9c9091275e707ab09d09a5a608fcdb84bf0dec85
        dest: Submodules/link
        disable-submodules: true
      - type: git
        url: https://github.com/chriskohlhoff/asio.git
        commit: 8806a6803cde7054c3049d3666d3ec36786568c5
        dest: Submodules/link/modules/asio-standalone
        disable-submodules: true
      - type: git
        url: https://github.com/sevagh/demucs.cpp.git
        commit: f1206e9adeea103aef4a636b9e62297cf1f8e34e
        dest: Submodules/demucs.cpp
        disable-submodules: true
      - type: git
        url: https://gitlab.com/libeigen/eigen.git
        commit: dd8c71e62852b2fe429edb6682ac91fd1c578a26
        dest: Submodules/demucs.cpp/vendor/eigen
        disable-submodules: true
      - type: git
        url: https://github.com/breakfastquay/rubberband.git
        commit: e4296ac80b1170018a110bc326fd0d45a0eb27d6
        dest: Submodules/rubberband
        disable-submodules: true

      # AppStream metadata, maintained next to this manifest.
      - type: file
        path: app.audionaut.Audionaut.metainfo.xml
