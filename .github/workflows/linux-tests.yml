name: Linux tests

# The Catch2 suite on Linux, as a Debug build: the only leg that runs the
# tests on Linux (Makefile CI builds the app and runs the MCP smoke test), and
# the only one where JUCE's assertions are live (macOS and Windows build
# Release). The CLI target is built too, so its smoke test runs here as well.
# Coverage is a manual run of its own (coverage.yml).

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Checkout submodules
      uses: ./.github/actions/checkout-submodules

    # Some test wavs (see .gitattributes) live in Git LFS; without this the
    # tests get pointer stubs and fail loading them. A separate step rather
    # than `lfs: true` on the checkout, which would also smudge whatever LFS
    # pointers the submodules carry.
    - name: Fetch Git LFS test files
      run: git lfs pull

    - name: Install JUCE build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk \
          libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev \
          libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
          libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev \
          mesa-common-dev libxi-dev libegl-dev xvfb

    - name: Configure
      run: cmake -B build -S Audionaut/Catch2Tests -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run tests
      working-directory: build
      run: xvfb-run -a ctest --output-on-failure --no-tests=error

    - name: Check that the suite left the fixtures alone
      shell: bash
      run: |
        if [ -n "$(git status --porcelain -- Audionaut/Catch2Tests/TestFiles)" ]; then
          echo "the test run left files under Audionaut/Catch2Tests/TestFiles:"
          git status --short -- Audionaut/Catch2Tests/TestFiles
          exit 1
        fi
