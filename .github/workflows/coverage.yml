name: Code coverage

# Run by hand (Actions > Code coverage > Run workflow) when you want the
# numbers; the Linux tests on every push and PR are linux-tests.yml.
on:
  workflow_dispatch:

jobs:
  coverage:
    # Linux/GCC rather than the macOS runner used by the Catch2 workflow: gcov
    # is native here, so gcovr needs no llvm-cov shim.
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Checkout submodules
      uses: ./.github/actions/checkout-submodules

    - name: Install JUCE build dependencies
      uses: ./.github/actions/install-linux-deps
      with:
        extra-packages: xvfb

    - name: Install gcovr
      run: pipx install gcovr

    - name: Build and run the tests
      # Debug is required, not incidental: the coverage flags are appended to the
      # target, but JUCE's recommended config flags inject -O3 for other build
      # types through INTERFACE options that land later on the command line.
      # --no-tests=error (in the action) matters doubly here: an unrun suite
      # would still produce a coverage number.
      uses: ./.github/actions/run-catch2-tests
      with:
        build-dir: build-coverage
        build-type: Debug
        cmake-args: -DAUDIONAUT_ENABLE_COVERAGE=ON
        wrapper: xvfb-run -a

    - name: Generate coverage report
      # Mirrors the `coverage` CMake target. --root is the repo root, not
      # Audionaut/Source: gcovr resolves --filter against it, and rooting at the
      # source dir filters every file back out. --gcov-ignore-errors guards
      # against headers from outside the repository defeating gcovr's
      # working-dir inference, as Essentia's once did.
      # --gcov-suspicious-hits-threshold=0: gcovr takes any count above a
      # billion for a gcov bug and stops, but SincResampler's inner loop
      # really runs that often. pipefail: without it `| tee` hides a failing
      # gcovr and the run stays green with no report.
      working-directory: build-coverage
      run: |
        set -o pipefail
        mkdir -p coverage-html
        gcovr --root "$GITHUB_WORKSPACE" \
              --filter "$GITHUB_WORKSPACE/Audionaut/Source" \
              --gcov-ignore-errors=no_working_dir_found \
              --gcov-suspicious-hits-threshold=0 \
              --exclude-unreachable-branches \
              --print-summary \
              --xml coverage.xml \
              --html-details coverage-html/index.html \
              . | tee "$GITHUB_WORKSPACE/coverage-summary.txt"

    - name: Publish summary
      # Surfaces the number on the run page so a regression is visible without
      # downloading the artifact.
      run: |
        {
          echo '## Code coverage'
          echo
          echo '```'
          cat coverage-summary.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          build-coverage/coverage.xml
          build-coverage/coverage-html/
        retention-days: 14
