name: Build and run Catch2 tests on macos

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Checkout submodules
      uses: ./.github/actions/checkout-submodules

    - name: Build and run the tests
      uses: ./.github/actions/run-catch2-tests
      with:
        build-type: Release
        config: Release
