# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: Build and run Catch2 tests on macos 

on:
  push:
    branches: 
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Checkout submodules
      uses: ./.github/actions/checkout-submodules

    # Some test wavs (see .gitattributes) live in Git LFS; without this the
    # tests get pointer stubs and fail loading them. A separate step rather
    # than `lfs: true` on the checkout, which would also smudge whatever LFS
    # pointers the submodules carry.
    - name: Fetch Git LFS test files
      run: git lfs pull

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -S${{github.workspace}}/Audionaut/Catch2Tests -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $(sysctl -n hw.ncpu)

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      # --no-tests=error: ctest passes by default when it finds no tests, which
      # is how a missing enable_testing() made this step a silent no-op.
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure --no-tests=error

    - name: Check that the suite left the fixtures alone
      # A test that opens a checked-in session in place would leave what it
      # imports or records in the repository (see FixtureSessionCopy in
      # Catch2Tests/Tests/TestEngine.h); the per-engine ProjectDirectories
      # keep one test's project directory from leaking into the next.
      shell: bash
      run: |
        if [ -n "$(git status --porcelain -- Audionaut/Catch2Tests/TestFiles)" ]; then
          echo "the test run left files under Audionaut/Catch2Tests/TestFiles:"
          git status --short -- Audionaut/Catch2Tests/TestFiles
          exit 1
        fi

