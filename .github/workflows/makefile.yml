name: Makefile CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Checkout submodules
      uses: ./.github/actions/checkout-submodules

    - name: Install dependencies
      uses: ./.github/actions/install-linux-deps

    - name: Compile
      run: make -C Audionaut/Builds/LinuxMakefile/ -j$(nproc)

    # Agents reach the app through Tools/audionaut-mcp, which runs the
    # installed binary with --json. The runner has no display, so this also
    # proves the CLI verbs need no X server.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: MCP server against the app
      working-directory: Tools/audionaut-mcp
      env:
        AUDIONAUT_CLI: ${{ github.workspace }}/Audionaut/Builds/LinuxMakefile/build/audionaut
      run: |
        test -z "$DISPLAY" && echo "no DISPLAY set"
        npm ci
        npm test
