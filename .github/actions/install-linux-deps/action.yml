name: Install Linux build dependencies
description: >
  apt packages JUCE needs to build the app and the test suite on Ubuntu,
  plus whatever a workflow adds through extra-packages (xvfb for the tests,
  equivs for the .deb). apt-get update first: the runner image's package
  index goes stale and apt-get install then 404s on superseded versions.

inputs:
  extra-packages:
    description: Space-separated packages installed along with the JUCE set.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install JUCE build dependencies
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        sudo apt-get update
        # EXTRA_PACKAGES unquoted on purpose: one argument per package
        sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk \
          libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev \
          libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
          libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev \
          mesa-common-dev libxi-dev libegl-dev $EXTRA_PACKAGES
